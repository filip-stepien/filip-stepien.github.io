<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edytor drzewka doboru produktów</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --bd:#e3e6ec; --line:#d6dae2;
    --tx:#1c2333; --tx2:#69718a; --hover:#f0f2f6;
    --q:#4f46e5; --a:#0891b2; --p:#059669; --warn:#d97706; --del:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--tx); background:var(--bg);
    display:flex; flex-direction:column;
  }

  .spacer{flex:1}
  button{font:inherit; cursor:pointer}

  /* ---------- dwa duże przyciski ---------- */
  .actions{display:flex; gap:12px; max-width:1000px; margin:0 auto 16px}
  .big{
    flex:1; border:1px solid var(--bd); background:#fff; color:var(--tx);
    border-radius:12px; padding:14px 24px; font-size:16px; font-weight:600;
    box-shadow:var(--shadow); transition:.12s;
  }
  .big.sim{background:var(--q); border-color:var(--q); color:#fff}
  .big.sim:hover{background:#4338ca; transform:translateY(-1px); box-shadow:0 4px 12px rgba(79,70,229,.28)}
  .big.reset:hover{background:#fef2f2; border-color:#fecaca; color:var(--del)}
  .btn{
    border:1px solid var(--bd); background:#fff; color:var(--tx);
    border-radius:8px; padding:6px 11px; font-size:13px; transition:.12s;
  }
  .btn:hover{background:var(--hover); border-color:#c9cfda}
  .btn.primary{background:var(--q); border-color:var(--q); color:#fff}
  .btn.primary:hover{background:#4338ca}
  .btn.danger:hover{background:#fef2f2; border-color:#fecaca; color:var(--del)}

  /* ---------- layout ---------- */
  main{flex:1; overflow:auto; padding:18px}
  .panel{
    background:#fff; border:1px solid var(--bd); border-radius:12px; box-shadow:var(--shadow);
    max-width:1000px; margin:0 auto; padding:16px 20px 28px;
  }
  .treehead{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .treehead input{
    font:inherit; font-size:16px; font-weight:650; border:0; background:transparent;
    padding:5px 8px; border-radius:7px; color:var(--tx); flex:1; min-width:0;
  }
  .treehead input:focus{background:var(--hover); outline:2px solid var(--q)}
  .treehead .count{font-size:12px; color:var(--tx2)}

  /* ---------- tree ---------- */
  .children{margin-left:14px; padding-left:22px; border-left:2px solid var(--line)}
  .children.root{margin-left:0; padding-left:0; border-left:0}
  .node{position:relative; margin:7px 0}
  .children:not(.root) > .node::before{
    content:''; position:absolute; left:-22px; top:20px; width:20px; height:2px; background:var(--line);
  }
  .card{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--bd); border-left:4px solid var(--ac);
    border-radius:10px; padding:5px 7px 5px 10px; box-shadow:var(--shadow);
  }
  .card:hover{border-color:#c9cfda; border-left-color:var(--ac)}
  .node.q{--ac:var(--q)} .node.a{--ac:var(--a)} .node.p{--ac:var(--p)}

  /* odpowiedź, która donikąd nie prowadzi */
  .card.dead, .card.dead:hover{border-color:var(--del); border-left-color:var(--del); background:#fffafa}

  .tag{
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ac); background:color-mix(in srgb, var(--ac) 10%, #fff);
    border:1px solid color-mix(in srgb, var(--ac) 25%, #fff);
    padding:2px 7px; border-radius:5px; white-space:nowrap; flex:none;
  }
  input.t{
    flex:1; min-width:60px; border:1px solid transparent; background:transparent; font:inherit;
    padding:5px 8px; border-radius:7px; color:var(--tx);
  }
  input.t::placeholder{color:#a8aec0}
  input.t:hover{background:var(--hover)}
  input.t:focus{background:#fff; outline:none; border-color:var(--ac); box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 15%, #fff)}
  input.note{flex:0 1 190px; font-size:12.5px; color:var(--tx2)}

  .ico{
    border:0; background:transparent; color:#9aa1b4; width:26px; height:26px; border-radius:6px;
    font-size:14px; line-height:1; display:grid; place-items:center; flex:none;
  }
  .ico:hover{background:var(--hover); color:var(--tx)}
  .ico.del:hover{background:#fef2f2; color:var(--del)}
  .ico.chev{color:var(--tx2); font-size:11px}

  .addbar{display:flex; gap:6px; padding:4px 0 2px}
  .add{
    border:1px dashed #c8cede; background:#fff; color:var(--tx2);
    border-radius:7px; padding:3px 10px; font-size:12.5px;
  }
  .add:hover{border-style:solid; color:var(--tx); background:var(--hover)}
  .add.q:hover{border-color:var(--q); color:var(--q)}
  .add.a:hover{border-color:var(--a); color:var(--a)}
  .add.p:hover{border-color:var(--p); color:var(--p)}

  .badge{font-size:11.5px; color:var(--warn); background:#fffbeb; border:1px solid #fde68a; padding:2px 7px; border-radius:5px; white-space:nowrap}
  .badge.dead{color:#fff; background:var(--del); border-color:var(--del); font-weight:600}
  .count{font-size:11.5px; color:var(--tx2); background:var(--hover); padding:2px 7px; border-radius:5px; white-space:nowrap}

  /* ---------- dialogi ---------- */
  dialog{border:0; border-radius:14px; padding:0; box-shadow:0 20px 60px rgba(16,24,40,.28); max-width:min(720px,94vw); width:100%}
  dialog::backdrop{background:rgba(17,24,39,.45)}
  .dlg-h{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--bd)}
  .dlg-h h2{margin:0; font-size:15px}
  .dlg-b{padding:18px; max-height:70vh; overflow:auto}
  .dlg-f{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--bd); background:#fafbfc; border-radius:0 0 14px 14px}

  .crumbs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
  .crumb{font-size:12px; background:var(--hover); border:1px solid var(--bd); padding:3px 9px; border-radius:20px; color:var(--tx2)}
  .simq{font-size:19px; font-weight:650; margin:0 0 14px}
  .opts{display:grid; gap:8px}
  .opt{
    text-align:left; border:1px solid var(--bd); background:#fff; border-radius:10px;
    padding:11px 14px; font-size:14px; transition:.12s;
  }
  .opt:hover{border-color:var(--q); background:#f5f4ff; transform:translateX(2px)}
  .res{border:1px solid #a7f3d0; background:#ecfdf5; border-radius:10px; padding:12px 14px; margin:8px 0}
  .res b{display:block; font-size:15px; color:#047857}
  .res small{color:var(--tx2)}
  .empty{color:var(--warn); background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:12px 14px}

  textarea{width:100%; height:320px; font:12px/1.5 ui-monospace,Consolas,monospace; border:1px solid var(--bd); border-radius:8px; padding:10px; resize:vertical}
</style>
</head>
<body>

<main>
  <div class="actions">
    <button class="big sim" id="bSim">▶ Symulacja</button>
    <button class="big reset" id="bReset">↺ Reset</button>
  </div>
  <section class="panel" id="canvas"></section>
</main>

<datalist id="katalog"></datalist>

<dialog id="dSim">
  <div class="dlg-h"><h2>Symulacja doboru</h2><div class="spacer"></div><button class="ico" onclick="dSim.close()">✕</button></div>
  <div class="dlg-b" id="simBody"></div>
  <div class="dlg-f">
    <button class="btn" id="simBack">← Cofnij</button>
    <button class="btn" id="simRestart">Od nowa</button>
    <button class="btn primary" onclick="dSim.close()">Zamknij</button>
  </div>
</dialog>

<script>
/* =====================================================================
   MODEL
   node = { id, type:'q'|'a'|'p', text, note?, children:[] }
     q – pytanie    (dzieci: wyłącznie odpowiedzi)
     a – odpowiedź  (dzieci: kolejne pytania i/lub produkty)
     p – produkt    (liść)
   ===================================================================== */

const KATALOG = ['Profi Clean A2','Profi Clean F5','Profi Clean W1','Biodyspergator B3',
  'Acticide CMG','Sol Clean X4','Profi Clean G8','Profi Clean PV'];

const q = (text,...c)=>({type:'q',text,children:c});
const a = (text,...c)=>({type:'a',text,children:c});
const p = (text,note='')=>({type:'p',text,note,children:[]});

const DEMO = () => ({ name:'Dobór produktu do czyszczenia', children:[
  q('Jaki jest stan instalacji?',
    a('Nowa instalacja', p('Profi Clean F5','przed pierwszym uruchomieniem')),
    a('Instalacja eksploatowana',
      q('Rodzaj zanieczyszczenia?',
        a('Kamień i rdza', p('Profi Clean A2')),
        a('Struktury biologiczne', p('Biodyspergator B3'), p('Acticide CMG')),
        a('Instalacja solarna', p('Sol Clean X4')))))
]});

/* =====================================================================
   STAN
   ===================================================================== */
const KEY = 'drzewko-doboru-v3';   // bump = nowe demo ładuje się bez klikania Reset
let tree = null;
const MAP = new Map();
const history = [];
let uidN = 0;
const uid = () => 'n' + (++uidN) + Math.random().toString(36).slice(2,6);

function assignIds(list){
  list.forEach(n=>{
    n.id = n.id || uid();
    n.text = n.text || '';
    n.children = n.children || [];
    assignIds(n.children);
  });
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const t = JSON.parse(raw); if(t && Array.isArray(t.children)){ tree = t; assignIds(tree.children); return; } }
  }catch(e){}
  tree = DEMO(); assignIds(tree.children);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(tree)); }
function snapshot(){ history.push(JSON.stringify(tree)); if(history.length>60) history.shift(); }
function undo(){ if(!history.length) return; tree = JSON.parse(history.pop()); save(); render(); }

/* =====================================================================
   OPERACJE
   ===================================================================== */
function reindex(){
  MAP.clear();
  (function walk(list, parent){
    list.forEach(n=>{ MAP.set(n.id,{node:n, list, parent}); walk(n.children, n); });
  })(tree.children, null);
}
function newNode(type){ return {id:uid(), type, text:'', note: type==='p'?'':undefined, children:[]}; }

function addChild(parentId, type){
  snapshot();
  const target = parentId ? MAP.get(parentId).node.children : tree.children;
  const n = newNode(type);
  if(type === 'q') n.children.push(newNode('a'));   // pytanie od razu z jedną odpowiedzią
  target.push(n);
  save(); render(); focusNode(n.id);
}
function remove(id){
  const {node, list} = MAP.get(id);
  const kids = countAll(node.children);
  if(kids && !confirm(`Usunąć „${node.text||'(bez nazwy)'}” razem z ${kids} elementami poniżej?`)) return;
  snapshot(); list.splice(list.indexOf(node),1); save(); render();
}
function move(id, dir){
  const {node, list} = MAP.get(id);
  const i = list.indexOf(node), j = i+dir;
  if(j<0 || j>=list.length) return;
  snapshot(); list.splice(i,1); list.splice(j,0,node); save(); render();
}
function clone(n){ return {...n, id:uid(), children:n.children.map(clone)}; }
function duplicate(id){
  const {node, list} = MAP.get(id);
  snapshot(); list.splice(list.indexOf(node)+1, 0, clone(node)); save(); render();
}
function countAll(list){ return list.reduce((s,n)=>s+1+countAll(n.children),0); }
function focusNode(id){
  const el = document.querySelector(`#n-${id} input.t`);
  if(el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); }
}

/* =====================================================================
   RENDER
   ===================================================================== */
const LABEL = {q:'Pytanie', a:'Odpowiedź', p:'Produkt'};
const PH    = {q:'Treść pytania, np. „Jaki jest stan instalacji?”',
               a:'Wariant odpowiedzi, np. „Nowa instalacja”',
               p:'Nazwa produktu'};

function render(){
  reindex();
  const c = document.getElementById('canvas');
  c.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'treehead';
  const nameIn = document.createElement('input');
  nameIn.value = tree.name;
  nameIn.placeholder = 'Nazwa drzewka';
  nameIn.oninput = e => { tree.name = e.target.value; save(); };
  nameIn.onfocus = () => snapshot();
  const st = stats();
  head.append(nameIn, mk('span','count', `${st.q} pytań · ${st.a} odpowiedzi · ${st.p} produktów`));
  c.append(head);

  const root = document.createElement('div');
  root.className = 'children root';
  tree.children.forEach(n => root.append(nodeEl(n)));
  root.append(addBar(null, ['q','p']));
  c.append(root);
}

function nodeEl(node){
  const wrap = document.createElement('div');
  wrap.className = 'node ' + node.type;
  wrap.id = 'n-' + node.id;

  const card = document.createElement('div');
  card.className = 'card';

  if(node.children.length){
    const ch = document.createElement('button');
    ch.className = 'ico chev';
    ch.textContent = node.collapsed ? '▶' : '▼';
    ch.title = 'Zwiń / rozwiń';
    ch.onclick = () => { node.collapsed = !node.collapsed; save(); render(); };
    card.append(ch);
  }else{
    const sp = document.createElement('span'); sp.style.width='26px'; sp.style.flex='none';
    card.append(sp);
  }

  card.append(mk('span','tag', LABEL[node.type]));

  const inp = document.createElement('input');
  inp.className = 't'; inp.value = node.text; inp.placeholder = PH[node.type];
  if(node.type === 'p') inp.setAttribute('list','katalog');
  inp.oninput = e => { node.text = e.target.value; save(); };
  inp.onfocus = () => snapshot();
  inp.onkeydown = e => {                       // Enter = kolejne rodzeństwo tego samego typu
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const {list} = MAP.get(node.id);
    const sib = newNode(node.type);
    if(node.type === 'q') sib.children.push(newNode('a'));
    snapshot(); list.splice(list.indexOf(node)+1, 0, sib); save(); render(); focusNode(sib.id);
  };
  card.append(inp);

  if(node.type === 'p'){
    const note = document.createElement('input');
    note.className = 't note'; note.value = node.note || ''; note.placeholder = 'uwaga / dozowanie';
    note.oninput = e => { node.note = e.target.value; save(); };
    note.onfocus = () => snapshot();
    card.append(note);
  }

  if(node.type === 'q' && !node.children.length) card.append(mk('span','badge','brak odpowiedzi'));
  if(node.type === 'a' && !node.children.length){                 // gałąź urywa się bez produktu
    card.classList.add('dead');
    card.append(mk('span','badge dead','pytanie bez odpowiedzi'));
  }
  if(node.collapsed && node.children.length)     card.append(mk('span','count','+' + countAll(node.children)));

  card.append(ico('⌃','W górę', ()=>move(node.id,-1)));
  card.append(ico('⌄','W dół',  ()=>move(node.id, 1)));
  card.append(ico('⧉','Duplikuj', ()=>duplicate(node.id)));
  const del = ico('✕','Usuń', ()=>remove(node.id)); del.classList.add('del');
  card.append(del);

  wrap.append(card);

  if(!node.collapsed && node.type !== 'p'){
    const kids = document.createElement('div');
    kids.className = 'children';
    node.children.forEach(k => kids.append(nodeEl(k)));
    kids.append(addBar(node.id, node.type === 'q' ? ['a'] : ['q','p']));
    wrap.append(kids);
  }
  return wrap;
}

function addBar(parentId, types){
  const bar = document.createElement('div');
  bar.className = 'addbar';
  const txt = {q:'+ pytanie', a:'+ odpowiedź', p:'+ produkt'};
  types.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'add ' + t; b.textContent = txt[t];
    b.onclick = () => addChild(parentId, t);
    bar.append(b);
  });
  return bar;
}
function ico(txt, title, fn){
  const b = document.createElement('button');
  b.className = 'ico'; b.textContent = txt; b.title = title; b.onclick = fn;
  return b;
}
function mk(tag, cls, txt){ const e = document.createElement(tag); e.className = cls; e.textContent = txt; return e; }
function stats(){
  const s = {q:0,a:0,p:0};
  (function walk(list){ list.forEach(n=>{ s[n.type]++; walk(n.children); }); })(tree.children);
  return s;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =====================================================================
   SYMULACJA – przejście drzewa tak, jak zobaczy je użytkownik końcowy
   ===================================================================== */
const dSim = document.getElementById('dSim');
let sim, simStack = [];

function simStart(){
  reindex();
  sim = { queue: tree.children.filter(n=>n.type==='q'),
          results: tree.children.filter(n=>n.type==='p'),
          path: [] };
  simStack = [];
  simDraw();
  if(!dSim.open) dSim.showModal();
}
function simPick(question, answer){
  simStack.push(JSON.stringify({queue:sim.queue.map(n=>n.id), results:sim.results.map(n=>n.id), path:sim.path}));
  const kids = answer.children;
  sim = {
    queue:   [...kids.filter(n=>n.type==='q'), ...sim.queue.slice(1)],
    results: [...sim.results, ...kids.filter(n=>n.type==='p')],
    path:    [...sim.path, {q:question.text, a:answer.text}]
  };
  simDraw();
}
function simBack(){
  const prev = simStack.pop();
  if(!prev) return;
  const st = JSON.parse(prev);
  sim = { queue: st.queue.map(id=>MAP.get(id).node),
          results: st.results.map(id=>MAP.get(id).node),
          path: st.path };
  simDraw();
}
function simDraw(){
  const b = document.getElementById('simBody');
  b.innerHTML = '';
  if(sim.path.length){
    const c = document.createElement('div'); c.className = 'crumbs';
    sim.path.forEach(s => c.append(mk('span','crumb', `${s.q} › ${s.a}`)));
    b.append(c);
  }
  document.getElementById('simBack').disabled = !simStack.length;

  const cur = sim.queue[0];
  if(cur){
    b.append(mk('h3','simq', cur.text || '(pytanie bez treści)'));
    const box = document.createElement('div'); box.className = 'opts';
    if(!cur.children.length) box.append(mk('div','empty','To pytanie nie ma jeszcze odpowiedzi.'));
    cur.children.forEach(ans=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      const nq = ans.children.filter(n=>n.type==='q').length;
      const np = ans.children.filter(n=>n.type==='p').length;
      const hint = np ? `${np} produkt(y)` + (nq ? ' + dalsze pytania' : '')
                      : nq ? 'dalsze pytania' : '⚠ pytanie bez odpowiedzi';
      btn.innerHTML = esc(ans.text || '(bez nazwy)') +
        `<span style="float:right;color:var(--tx2);font-size:12px">${hint}</span>`;
      btn.onclick = () => simPick(cur, ans);
      box.append(btn);
    });
    b.append(box);
    return;
  }

  b.append(mk('h3','simq','Dobrane produkty'));
  if(!sim.results.length){
    b.append(mk('div','empty','Ta ścieżka nie kończy się żadnym produktem – uzupełnij drzewo.'));
    return;
  }
  sim.results.forEach(r=>{
    const d = document.createElement('div'); d.className = 'res';
    d.innerHTML = `<b>${esc(r.text || '(produkt bez nazwy)')}</b>` + (r.note ? `<small>${esc(r.note)}</small>` : '');
    b.append(d);
  });
}
document.getElementById('bSim').onclick = simStart;
document.getElementById('simBack').onclick = simBack;
document.getElementById('simRestart').onclick = simStart;

/* =====================================================================
   RESET / UNDO
   ===================================================================== */
document.getElementById('bReset').onclick = () => {
  if(!confirm('Przywrócić dane demo? Bieżące zmiany zostaną utracone.')) return;
  snapshot(); tree = DEMO(); assignIds(tree.children); save(); render();
};
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
});

/* start */
document.getElementById('katalog').innerHTML = KATALOG.map(k=>`<option value="${esc(k)}">`).join('');
load();
render();
</script>
</body>
</html>
